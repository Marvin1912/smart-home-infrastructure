{{- range .Values.certificates }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  secretName: {{ .secretName }}
  renewBefore: {{ .renewBefore }}
  issuerRef:
    name: {{ $.Values.clusterIssuer.name }}
    kind: ClusterIssuer
  dnsNames:
{{- range .dnsNames }}
    - {{ . | quote }}
{{- end }}
---
{{- end }}
