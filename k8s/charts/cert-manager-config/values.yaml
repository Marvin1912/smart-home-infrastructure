clusterIssuer:
  name: letsencrypt-prod
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  acmeEmail: geitnermarvin@gmail.com
  privateKeySecretName: letsencrypt-prod-account-key
  cloudflareApiTokenSecretName: cloudflare-api-key
  cloudflareApiTokenSecretKey: CLOUDFLARE_TOKEN

certificates:
  - name: wildcard-geitner-cc
    namespace: default
    secretName: wildcard-tls
    dnsNames:
      - geitner.cc
      - "*.geitner.cc"
    renewBefore: 720h
  # IngressRoute.spec.tls.secretName requires the Secret to live in the same
  # namespace as the IngressRoute — the ArgoCD IngressRoute lives in "argocd",
  # not "default", so it needs its own copy of the wildcard certificate (#112).
  - name: wildcard-geitner-cc-argocd
    namespace: argocd
    secretName: wildcard-tls
    dnsNames:
      - geitner.cc
      - "*.geitner.cc"
    renewBefore: 720h

# Renewal monitoring (#113): scrape cert-manager's own metrics and alert if a
# certificate is close to expiry without having renewed, or cert-manager reports
# it as not Ready.
serviceMonitor:
  enabled: true
  releaseLabel: kube-prometheus-stack

prometheusRules:
  enabled: true
  releaseLabel: kube-prometheus-stack
  # 14 days: renewBefore above is 720h/30d, so a healthy certificate should have
  # already renewed well before this threshold — firing here means something is
  # actually wrong (DNS-01 challenge failing, ClusterIssuer misconfigured, etc.).
  expirySoonSeconds: 1209600
