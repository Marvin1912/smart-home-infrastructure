apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.middlewares.hstsHeaders.name }}
  namespace: {{ .Values.ingressRoute.namespace }}
spec:
  headers:
    stsSeconds: {{ .Values.middlewares.hstsHeaders.maxAgeSeconds | int }}
    stsIncludeSubdomains: {{ .Values.middlewares.hstsHeaders.includeSubdomains }}
    stsPreload: {{ .Values.middlewares.hstsHeaders.preload }}
