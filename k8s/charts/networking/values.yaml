ingressRoute:
  name: kube-test
  namespace: default
  tls:
    secretName: wildcard-tls
  routes:
    prometheus:
      host: prometheus.geitner.cc
      service: kube-prometheus-stack-prometheus
      port: 9090
    grafana:
      host: grafana.geitner.cc
      service: grafana-service
      port: 3000
    influxdb:
      host: influxdb.geitner.cc
      service: influxdb-service
      port: 8086
    frontend:
      host: frontend.geitner.cc
      service: frontend-service
      port: 80
    backend:
      host: backend.geitner.cc
      service: applications-service
      port: 9055
    wiki:
      host: wiki.geitner.cc
      service: wikijs-service
      port: 3000
    anki:
      host: anki.geitner.cc
      service: anki-service
      port: 8000
    stock:
      host: stock.geitner.cc
      service: stock-portfolio-tracker-service
      port: 8000
    bpTracker:
      host: bp-tracker.geitner.cc
      service: bp-tracker-service
      port: 5001
    registry:
      host: registry.geitner.cc
      service: registry-ui
      port: 8090

middlewares:
  frontendNoCache:
    name: frontend-no-cache
  # HSTS: evaluated as part of #113 after all services were verified to serve a
  # valid Let's Encrypt chain over websecure. 180 days (not the 1-2 years typical
  # for public sites) since this is the first rollout on an internal-only domain;
  # preload is off on purpose — geitner.cc is not (and should not become) submitted
  # to browsers' HSTS preload list, which is effectively irreversible.
  hstsHeaders:
    name: hsts-headers
    maxAgeSeconds: 15552000
    includeSubdomains: true
    preload: false

ingressRouteArgocd:
  name: argocd
  namespace: argocd
  tls:
    secretName: wildcard-tls
  host: argocd.geitner.cc
  service: argocd-server
  port: 80

ingressRouteTcp:
  name: postgres-tcp-route
  namespace: default
  entryPoints:
    - postgres
  service: postgres-service
  port: 5432
