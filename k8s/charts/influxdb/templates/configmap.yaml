apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-setup-script
  namespace: default
  annotations:
    helm.sh/hook: pre-install
data:
  setup_influxdb.sh: |
    #!/usr/bin/env bash

    # InfluxDB Configuration Setup Script
    # This script recreates the InfluxDB configuration from 192.168.178.29:8086
    #
    # Runs on every Argo CD sync (Argo CD maps the Helm post-install hook of
    # the setup job to PostSync), so every step must be idempotent: existing
    # buckets and tasks are left alone and the temporary API token is revoked.

    set -e

    # Configuration variables
    # shellcheck disable=SC2269
    INFLUX_URL="${INFLUX_URL:-http://localhost:8086}"
    INFLUX_ORG="wildfly_domain"
    INIT_TOKEN="${INIT_TOKEN:-}"
    INFLUX_TOKEN="${INFLUX_TOKEN:-}"

    # Colors for output
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    NC='\033[0m' # No Color

    # Function to print colored output
    print_success() {
        echo -e "${GREEN}✓ $1${NC}"
    }

    print_error() {
        echo -e "${RED}✗ $1${NC}"
    }

    print_info() {
        echo -e "${YELLOW}ℹ $1${NC}"
    }

    # Generate a new API token using the initial admin token
    generate_api_token() {
        print_info "Generating temporary API token..."

        # Use the init token to create a proper API token with all permissions
        local org_response=$(curl -s -H "Authorization: Token $INIT_TOKEN" \
            "$INFLUX_URL/api/v2/orgs" | \
            jq -r ".orgs[] | select(.name==\"$INFLUX_ORG\") | .id" 2>/dev/null || echo "")

        if [ -z "$org_response" ]; then
            print_error "Organization '$INFLUX_ORG' not found or init token invalid"
            exit 1
        fi

        # Create a new token with read/write permissions for the organization
        local token_response=$(curl -s -X POST \
            -H "Authorization: Token $INIT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
                \"status\": \"active\",
                \"description\": \"API token for InfluxDB setup\",
                \"orgID\": \"$org_response\",
                \"permissions\": [
                    {
                        \"action\": \"read\",
                        \"resource\": {
                            \"type\": \"orgs\"
                        }
                    },
                    {
                        \"action\": \"write\",
                        \"resource\": {
                            \"type\": \"orgs\"
                        }
                    },
                    {
                        \"action\": \"read\",
                        \"resource\": {
                            \"type\": \"buckets\",
                            \"orgID\": \"$org_response\"
                        }
                    },
                    {
                        \"action\": \"write\",
                        \"resource\": {
                            \"type\": \"buckets\",
                            \"orgID\": \"$org_response\"
                        }
                    },
                    {
                        \"action\": \"read\",
                        \"resource\": {
                            \"type\": \"tasks\",
                            \"orgID\": \"$org_response\"
                        }
                    },
                    {
                        \"action\": \"write\",
                        \"resource\": {
                            \"type\": \"tasks\",
                            \"orgID\": \"$org_response\"
                        }
                    }
                ]
            }" \
            "$INFLUX_URL/api/v2/authorizations")

        INFLUX_TOKEN=$(echo "$token_response" | jq -r '.token')
        INFLUX_TOKEN_ID=$(echo "$token_response" | jq -r '.id')

        if [ -z "$INFLUX_TOKEN" ] || [ "$INFLUX_TOKEN" = "null" ]; then
            print_error "Failed to generate API token"
            echo "Response: $token_response"
            exit 1
        fi

        # The token is only needed for this run; revoke it on exit so repeated
        # runs don't pile up tokens.
        trap revoke_api_token EXIT

        print_success "Temporary API token generated successfully"
    }

    # Revoke the temporary API token created by generate_api_token
    revoke_api_token() {
        if [ -n "$INFLUX_TOKEN_ID" ] && [ "$INFLUX_TOKEN_ID" != "null" ]; then
            curl -s -X DELETE -H "Authorization: Token $INIT_TOKEN" \
                "$INFLUX_URL/api/v2/authorizations/$INFLUX_TOKEN_ID" > /dev/null
            print_success "Temporary API token revoked"
        fi
    }

    # Check if InfluxDB is running
    check_influxdb() {
        print_info "Checking InfluxDB connection... $INFLUX_URL"
        local retries=0
        local max_retries=30

        while [ $retries -lt $max_retries ]; do
            if curl -s "$INFLUX_URL/health" > /dev/null; then
                print_success "InfluxDB is accessible at $INFLUX_URL"
                return 0
            fi
            print_info "Waiting for InfluxDB to be ready... ($((retries + 1))/$max_retries)"
            sleep 5
            retries=$((retries + 1))
        done

        print_error "Cannot connect to InfluxDB at $INFLUX_URL after $max_retries attempts"
        exit 1
    }

    # Check if organization exists, create if not
    setup_organization() {
        print_info "Setting up organization '$INFLUX_ORG'..."

        # Check if org exists
        ORG_ID=$(curl -s -H "Authorization: Token $INFLUX_TOKEN" \
            "$INFLUX_URL/api/v2/orgs" | \
            jq -r ".orgs[] | select(.name==\"$INFLUX_ORG\") | .id" 2>/dev/null || echo "")

        if [ -z "$ORG_ID" ]; then
            print_info "Creating organization '$INFLUX_ORG'..."
            ORG_ID=$(curl -s -X POST -H "Authorization: Token $INFLUX_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$INFLUX_ORG\",\"description\":\"\"}" \
                "$INFLUX_URL/api/v2/orgs" | jq -r '.id')
            print_success "Organization '$INFLUX_ORG' created with ID: $ORG_ID"
        else
            print_success "Organization '$INFLUX_ORG' already exists with ID: $ORG_ID"
        fi
    }

    # Create a bucket unless one with that name already exists
    # Usage: create_bucket <name> <retention seconds, 0 = infinite>
    create_bucket() {
        local name="$1"
        local retention="$2"

        local existing_id=$(curl -s -H "Authorization: Token $INFLUX_TOKEN" \
            "$INFLUX_URL/api/v2/buckets?orgID=$ORG_ID&name=$name" | \
            jq -r '.buckets[0].id // empty')

        if [ -n "$existing_id" ]; then
            print_success "Bucket '$name' already exists with ID: $existing_id"
            return 0
        fi

        print_info "Creating bucket '$name'..."
        local bucket_id=$(curl -s -X POST -H "Authorization: Token $INFLUX_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                "orgID": "'"$ORG_ID"'",
                "name": "'"$name"'",
                "retentionRules": [
                    {
                        "type": "expire",
                        "everySeconds": '"$retention"',
                        "shardGroupDurationSeconds": 604800
                    }
                ]
            }' \
            "$INFLUX_URL/api/v2/buckets" | jq -r '.id')
        print_success "Bucket '$name' created with ID: $bucket_id"
    }

    # Create user buckets
    create_buckets() {
        print_info "Creating user buckets..."

        create_bucket costs 0
        create_bucket sensor_data 7776000
        create_bucket sensor_data_30m 0
        create_bucket system_metrics 0
    }

    # Create scheduled tasks
    create_tasks() {
        print_info "Creating scheduled tasks..."

        # Task: Downsample to 30m means (Active)
        # Runs daily and aggregates the [-95d, -83d] window (a 12-day window
        # around the 90-day retention cutoff) into 30m means, then writes the
        # result into sensor_data_30m. The wide window gives ~5 days of overlap
        # so a missed run doesn't lose data before it ages out of sensor_data's
        # 90-day retention; re-processing already-downsampled points is a no-op
        # (same series+timestamp just overwrites).
        local existing_task=$(curl -s -H "Authorization: Token $INFLUX_TOKEN" \
            "$INFLUX_URL/api/v2/tasks?orgID=$ORG_ID&name=Downsample%20to%2030m%20means" | \
            jq -r '.tasks[0].id // empty')

        if [ -n "$existing_task" ]; then
            print_success "Task 'Downsample to 30m means' already exists with ID: $existing_task"
            return 0
        fi

        print_info "Creating task 'Downsample to 30m means' (Active)..."
        TASK1_FLUX='option task = {name: "Downsample to 30m means", every: 1d}

    from(bucket: "sensor_data")
        |> range(start: -95d, stop: -83d)
        |> filter(fn: (r) => r._field == "value")
        |> aggregateWindow(every: 30m, fn: mean, createEmpty: false)
        |> to(bucket: "sensor_data_30m")'

        TASK1_ID=$(curl -s -X POST -H "Authorization: Token $INFLUX_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                "orgID": "'"$ORG_ID"'",
                "org": "'"$INFLUX_ORG"'",
                "name": "Downsample to 30m means",
                "status": "active",
                "flux": '"$(echo "$TASK1_FLUX" | jq -Rs .)"',
                "every": "1d"
            }' \
            "$INFLUX_URL/api/v2/tasks" | jq -r '.id')
        print_success "Task 'Downsample to 30m means' created with ID: $TASK1_ID"
    }

    # Verify configuration
    verify_setup() {
        print_info "Verifying configuration..."

        echo ""
        print_info "Created buckets:"
        curl -s -H "Authorization: Token $INFLUX_TOKEN" \
            "$INFLUX_URL/api/v2/buckets?org=$INFLUX_ORG" | \
            jq -r '.buckets[] | "  - \(.name) (ID: \(.id), Retention: \(.retentionRules[0].everySeconds // "infinite") seconds)"'

        echo ""
        print_info "Created tasks:"
        curl -s -H "Authorization: Token $INFLUX_TOKEN" \
            "$INFLUX_URL/api/v2/tasks?org=$INFLUX_ORG" | \
            jq -r '.tasks[] | "  - \(.name) (ID: \(.id), Status: \(.status), Every: \(.every))"'
    }

    # Main execution
    main() {
        echo "🚀 InfluxDB Configuration Setup Script"
        echo "====================================="
        echo "Target: $INFLUX_URL"
        echo "Organization: $INFLUX_ORG"
        echo ""

        check_influxdb
        generate_api_token
        setup_organization
        create_buckets
        create_tasks
        verify_setup

        echo ""
        print_success "InfluxDB configuration setup completed successfully!"
        echo ""
        echo "Configuration Summary:"
        echo "  - Organization: $INFLUX_ORG (ID: $ORG_ID)"
        echo "  - User Buckets: 4 (costs, sensor_data, sensor_data_30m, system_metrics)"
        echo "  - Tasks: 1 (active)"
    }

    # Run main function
    main "$@"
