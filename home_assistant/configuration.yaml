
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

panel_iframe:
  portfolio:
    title: "Portfolio"
    url: "http://192.168.178.29:5800/"
    icon: "mdi:bitcoin"
  consul:
    title: "Consul"
    url: "http://192.168.178.29:8500"
    icon: "mdi:folder-key"

influxdb:
  api_version: 2
  ssl: true
  host: influxdb.geitner.cc
  port: 443
  token: rmz5aaaKYSpgvXSO3C1UFZmXjvtpwI81b7hcMaMJJqOTjvgI82iNAbSsF7fpGIy2fduNDKACQ759cyaiECrulg==
  organization: wildfly_domain
  bucket: sensor_data
  tags:
    source: HA
  tags_attributes:
    - friendly_name
  default_measurement: units
  include:
    entities:
      - sensor.0xa4c1384930c28843_power
      - sensor.0xa4c1384930c28843_energy
    entity_globs:
      - sensor.tasmota*
      - sensor.moisture*
      - sensor.*_temperature
      - sensor.*_humidity
      - sensor.*_moisture
      - sensor.*_battery_*

prometheus:
  filter:
    include_entity_globs:
      - sensor.*_battery*
      - sensor.moisture*
      - sensor.*_moisture
      - sensor.*_batterie
